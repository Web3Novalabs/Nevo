name: CI
on: [push, pull_request]
jobs:
  build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nevo_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check react / react-dom versions match
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const pkgs = lock.packages || {};
            const find = (name) => {
              const entry = pkgs[`node_modules/${name}`];
              return entry && entry.version;
            };
            const react = find("react");
            const reactDom = find("react-dom");
            if (!react || !reactDom) {
              console.error(`Could not resolve versions: react=${react} react-dom=${reactDom}`);
              process.exit(1);
            }
            if (react !== reactDom) {
              console.error(`ERROR: react (${react}) and react-dom (${reactDom}) must be the same version.`);
              process.exit(1);
            }
            console.log(`react and react-dom both resolve to ${react}`);
          '

      - name: Check for remaining mock data
        run: |
          if grep -r "MOCK_" app/ src/store/ \
            --include="*.ts" \
            --include="*.tsx" -l; then
            echo "ERROR: MOCK_ constants found. Remove all mock data before merging to main."
            exit 1
          fi

  server:
    name: Server — Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nevo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nevo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./nevo_server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nevo_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nevo_server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`,
              );
              console.log(["### Server test coverage", "", "| metric | % | covered |", "|---|---|---|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was produced (the test step failed before coverage was written)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: |
            nevo_server/coverage/coverage-summary.json
            nevo_server/coverage/lcov.info
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Export OpenAPI spec
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run export:openapi

      - name: Install frontend dependencies
        working-directory: ./nevo_frontend
        run: npm install --legacy-peer-deps

      - name: Check generated API types are up to date
        working-directory: ./nevo_frontend
        run: npm run check:api-types

  contract:
    name: Contract — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nevo_contract
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nevo_contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('nevo_contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contract
        run: cargo build --release --target wasm32v1-none

      - name: Run tests
        run: cargo test --lib

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  workflow-lint:
    name: Workflow — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  markdown-links:
    name: Markdown — Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc_config.json"
