name: CI
on: [push, pull_request]
jobs:
  build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nevo_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check for remaining mock data
        run: |
          if grep -r "MOCK_" app/ src/store/ \
            --include="*.ts" \
            --include="*.tsx" -l; then
            echo "ERROR: MOCK_ constants found. Remove all mock data before merging to main."
            exit 1
          fi

  server:
    name: Server — Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nevo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nevo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./nevo_server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nevo_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nevo_server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --runInBand donations

      - name: Build
        run: npm run build

  contract:
    name: Contract — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nevo_contract
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nevo_contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('nevo_contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # soroban-sdk 28 refuses plain `cargo build` for wasm and requires
      # `stellar contract build` from stellar-cli v25.2.0+.
      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.1.0

      - name: Build contract
        run: stellar contract build

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --lib

  markdown-links:
    name: Markdown — Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc_config.json"

  workflow-lint:
    name: Workflows — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
